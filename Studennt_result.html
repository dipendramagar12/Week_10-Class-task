<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Result Management System</title>
  <link rel="stylesheet" href="Student_result.css">
</head>
<body>
  <div class="container">
    <h1>Student Result Management System</h1>

    <div class="form">
      <label for="name">Student Name</label>
      <input type="text" id="name" placeholder="Enter student name">

      <label for="math">Mathematics</label>
      <input type="number" id="math" placeholder="0 - 100">

      <label for="science">Science</label>
      <input type="number" id="science" placeholder="0 - 100">

      <label for="computer">Computer</label>
      <input type="number" id="computer" placeholder="0 - 100">

      <div class="buttons">
        <button id="addBtn">Add Student</button>
        <button id="listBtn" class="secondary">Generate Student List</button>
      </div>
    </div>

    <p id="message"></p>

    <section id="result">
      <h2>Student Results</h2>
      <div id="resultContent">No student added yet.</div>
    </section>
  </div>

  <script src="Student_result.js"></script>
</body>
</html>
