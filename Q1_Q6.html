<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q1 - Q6</title>
</head>
<body>
  <h1>Q1 - Q6 Practice</h1>

  <button onclick="q1()">Q1 Even/Odd</button>
  <button onclick="q2()">Q2 Print 1-50</button>
  <button onclick="q3()">Q3 Largest</button>
  <button onclick="q4()">Q4 Table</button>
  <button onclick="q5()">Q5 Sum</button>
  <button onclick="q6()">Q6 Login</button>

  <pre id="output"></pre>

  <script>
    function show(text) {
      document.getElementById("output").textContent = text;
    }

    function q1() {
      var n = Number(prompt("Enter a number:"));
      if (n % 2 === 0) {
        show("The number is Even");
      } else {
        show("The number is Odd");
      }
    }

    function q2() {
      var all = "";
      var by5 = "";
      for (var i = 1; i <= 50; i++) {
        all += i + " ";
        if (i % 5 === 0) {
          by5 += i + " ";
        }
      }
      console.log(all);
      console.log(by5);
      show("1 to 50:\n" + all + "\n\nDivisible by 5:\n" + by5);
    }

    function q3() {
      var a = Number(prompt("Enter first number:"));
      var b = Number(prompt("Enter second number:"));
      var c = Number(prompt("Enter third number:"));
      var largest;
      if (a >= b && a >= c) {
        largest = a;
      } else if (b >= a && b >= c) {
        largest = b;
      } else {
        largest = c;
      }
      show("The largest number is " + largest);
    }

    function q4() {
      var n = Number(prompt("Enter a number:"));
      var result = "";
      for (var i = 1; i <= 10; i++) {
        result += n + " x " + i + " = " + (n * i) + "\n";
      }
      show(result);
    }

    function q5() {
      var i = 1;
      var sum = 0;
      while (i <= 100) {
        sum += i;
        i++;
      }
      show("Sum of numbers from 1 to 100 = " + sum);
    }

    function q6() {
      var username = prompt("Enter username:");
      var password = prompt("Enter password:");
      if (username === "admin" && password === "12345") {
        show("Login Successful");
      } else {
        show("Invalid Username or Password");
      }
    }
  </script>
</body>
</html>
